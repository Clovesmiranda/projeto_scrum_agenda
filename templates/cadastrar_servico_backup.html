<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Serviço</title>
    <style>
        body {
            background: #f2f2f2;
            font-family: Arial;
            padding: 40px;
        }
        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #ccc;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Cadastrar Serviço</h2>

        <form method="post" action="/servicos">
            <label>Nome do serviço:</label>
            <input type="text" name="nome" required>

            <label>Preço:</label>
            <input type="number" step="0.01" name="preco" required>

            <label>Duração:</label>
            <input type="text" name="duracao" required>

            <button type="submit">Salvar</button>
        </form>
    </div>

</body>
</html>
