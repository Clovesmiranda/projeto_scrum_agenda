<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamentos</title>
<link rel="stylesheet" href="/static/css/styles.css">

</head>
<body class="table-page">

    <h2 style="text-align:center;">Agendamentos</h2>

    <table>
        <tr>
            <th>Serviço</th>
            <th>Profissional</th>
            <th>Data</th>
            <th>Horário</th>
        </tr>

        {% for ag in agendamentos %}
        <tr>
            <td>{{ ag['servico_nome'] }}</td>
            <td>{{ ag['profissional_nome'] }}</td>
            <td>{{ ag['data'] }}</td>
            <td>{{ ag['horario'] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
