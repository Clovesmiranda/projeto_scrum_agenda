<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamentos</title>
    <style>
        body {
            background: #f2f2f2;
            font-family: Arial;
            padding: 40px;
        }
        table {
            width: 80%;
            margin: auto;
            background: white;
            border-collapse: collapse;
            box-shadow: 0px 0px 10px #ccc;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Agendamentos</h2>

    <table>
        <tr>
            <th>Serviço</th>
            <th>Profissional</th>
            <th>Data</th>
            <th>Horário</th>
        </tr>

        {% for ag in agendamentos %}
        <tr>
            <td>{{ ag['servico_id'] }}</td>
            <td>{{ ag['profissional_id'] }}</td>
            <td>{{ ag['data'] }}</td>
            <td>{{ ag['horario'] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
