<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Listar Profissionais</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>

<body class="table-page">
    
    <h1>Lista de Profissionais</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Especialidade</th>
            </tr>
        </thead>
        <tbody id="tabela-profissionais"></tbody>
    </table>

    <script>
        fetch("/profissionais")
            .then(res => res.json())
            .then(profissionais => {
                const tabela = document.getElementById("tabela-profissionais");

                profissionais.forEach(p => {
                    tabela.innerHTML += `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.nome}</td>
                            <td>${p.especialidade}</td>
                        </tr>
                    `;
                });
            });
    </script>
</body>
</html>
