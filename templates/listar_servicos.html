<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Listar Serviços</title>
<link rel="stylesheet" href="/static/css/styles.css">
    
</head>

<body>
    <h1>Lista de Serviços</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Duração</th>
            </tr>
        </thead>
        <tbody id="tabela-servicos"></tbody>
    </table>

    <script>
        fetch("/servicos")
            .then(res => res.json())
            .then(servicos => {
                const tabela = document.getElementById("tabela-servicos");

                servicos.forEach(s => {
                    tabela.innerHTML += `
                        <tr>
                            <td>${s.id}</td>
                            <td>${s.nome}</td>
                            <td>R$ ${s.preco.toFixed(2)}</td>
                            <td>${s.duracao}</td>
                        </tr>
                    `;
                });
            });
    </script>
</body>
</html>
